<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준경준경 투어 🗼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--surface:#fff;--border:#e8e4dc;--text:#1a1814;--muted:#8a8680;--hint:#bbb8b2;--accent:#c8472a;--accent-light:#fdf0ed;--green:#2a7a4f;--green-light:#edf7f2;--amber:#b87d1a;--amber-light:#fdf6e8;--blue:#2054a8;--blue-light:#eef3fc;--radius:12px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
header{background:var(--text);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.logo{font-family:"DM Serif Display",serif;font-size:18px;color:#fff}.logo span{color:var(--accent)}
.header-meta{font-size:12px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:12px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#888;display:inline-block;margin-right:5px;transition:background .3s}
.sync-dot.live{background:#4caf7d;animation:pulse 2s infinite}.sync-dot.error{background:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:12px 14px;font-size:12px;font-family:"Noto Sans KR",sans-serif;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
nav button.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
main{max-width:780px;margin:0 auto;padding:24px 16px 80px}
.page{display:none}.page.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-blue{background:#E6F1FB;color:#0C447C}.badge-green{background:#EAF3DE;color:#27500A}
.badge-amber{background:#FAEEDA;color:#633806}.badge-gray{background:#F1EFE8;color:#444441}
button{font-family:"Noto Sans KR",sans-serif;cursor:pointer;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;padding:7px 14px;transition:all .15s}
button:hover{background:var(--bg)}
button.primary{background:var(--text);color:#fff;border-color:var(--text)}
button.primary:hover{background:#333}
button.danger-btn{color:var(--accent);border-color:transparent;background:none;padding:4px 6px}
input,select,textarea{font-family:"Noto Sans KR",sans-serif;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;background:var(--surface);color:var(--text);width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--text)}
textarea{resize:vertical;min-height:60px}
.input-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}.input-row input,.input-row select{flex:1}
.section-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero{background:var(--text);color:#fff;border-radius:var(--radius);padding:0;margin-bottom:16px;position:relative;overflow:hidden;min-height:200px;display:flex;align-items:flex-end}
.hero-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:.45}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,24,20,.95) 0%,rgba(26,24,20,.4) 60%,transparent 100%)}
.hero-content{position:relative;z-index:2;padding:24px 20px 20px;width:100%;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.hero-left h1{font-family:"DM Serif Display",serif;font-size:28px;line-height:1.1;margin-bottom:4px}
.hero-left h1 span{color:var(--accent)}.hero-left p{font-size:12px;color:rgba(255,255,255,.5)}
.dday-box{text-align:right}.dday-num{font-family:"DM Serif Display",serif;font-size:40px;color:var(--accent);line-height:1}
.dday-label{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.metric-label{font-size:11px;color:var(--muted);margin-bottom:4px}.metric-value{font-size:20px;font-weight:500}
.member-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.member-card{text-align:center}.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin:0 auto 6px}
.member-name{font-size:12px}.member-role{font-size:10px;color:var(--muted)}
.day-block{margin-bottom:24px}.day-title{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.tl-wrap{position:relative;padding-left:24px}.tl-wrap::before{content:"";position:absolute;left:7px;top:8px;bottom:0;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:var(--surface)}
.tl-dot.adopted{border-color:var(--green);background:var(--green-light)}.tl-dot.pending{border-color:var(--amber);background:var(--amber-light)}
.tl-time{font-size:11px;color:var(--hint);margin-bottom:2px}.tl-title{font-size:14px;font-weight:500;margin-bottom:3px}
.tl-desc{font-size:12px;color:var(--muted);margin-bottom:5px}.tl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admin-bar{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-bar label{font-size:12px;color:var(--muted)}.admin-bar input{width:100px;flex:none}
.suggest-form{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.form-title{font-size:13px;font-weight:500;margin-bottom:12px;color:var(--muted)}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.expense-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.expense-item:last-child{border:none}
.settle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.settle-row:last-child{border:none}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.check-item:last-child{border:none}.check-item.done .check-text{text-decoration:line-through;color:var(--hint)}
.place-item{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.place-item:last-child{border:none}
.place-name{font-size:14px;font-weight:500;margin-bottom:3px}.place-note{font-size:12px;color:var(--muted)}
.map-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border:1px solid #b5d4f4;color:var(--blue);border-radius:var(--radius-sm);text-decoration:none;white-space:nowrap}
.map-link:hover{background:var(--blue-light)}
.pending-card{border-left:3px solid var(--amber);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;background:var(--amber-light);margin-bottom:10px;display:flex;justify-content:space-between;align-items:start;gap:12px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;color:var(--muted);gap:12px}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.plan-btn{font-size:12px;padding:8px;text-align:left;line-height:1.5;flex:1}
.progress-wrap{background:var(--border);border-radius:20px;height:8px;margin-top:8px;overflow:hidden}
.progress-bar{height:8px;border-radius:20px;background:var(--green);transition:width .5s}
</style>
</head>
<body>
<header>
  <div class="logo">JUNKYEONG<span>TOUR</span></div>
  <div class="header-meta">
    <span><span class="sync-dot" id="sync-dot"></span><span id="sync-label">연결 중...</span></span>
    <span>🗼 도쿄 7/15-21</span>
  </div>
</header>
<nav id="main-nav">
  <button class="active" onclick="showPage('home')">🏠 홈</button>
  <button onclick="showPage('schedule')">📅 일정</button>
  <button onclick="showPage('expense')">💴 경비</button>
  <button onclick="showPage('checklist')">✅ 준비물</button>
  <button onclick="showPage('places')">📍 숙소·맛집</button>
</nav>
<main>

<div id="page-home" class="page active">
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1542640244-7e672d6cef4e?w=1200&q=80" class="hero-bg-img" alt="후지산">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-left">
        <h1>준경준경<br><span>투어</span></h1>
        <p>5인 5색 도쿄 어드벤처 · 7월 15일 – 21일</p>
      </div>
      <div class="dday-box">
        <div class="dday-num" id="dday-num">–</div>
        <div class="dday-label" id="dday-label">출발까지</div>
      </div>
    </div>
  </div>
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">여행 기간</div><div class="metric-value">7일</div></div>
    <div class="metric"><div class="metric-label">멤버</div><div class="metric-value">5명</div></div>
    <div class="metric"><div class="metric-label">목적지</div><div class="metric-value">도쿄</div></div>
    <div class="metric"><div class="metric-label">채택 일정</div><div class="metric-value" id="adopted-count">–</div></div>
  </div>
  <div class="card">
    <div class="section-label">멤버</div>
    <div class="member-grid">
      <div class="member-card"><div class="avatar" style="background:#eeedfe;color:#3c3489">준경</div><div class="member-name">박준경</div><div class="member-role">관리자</div></div>
      <div class="member-card"><div class="avatar" style="background:#e6f1fb;color:#0c447c">재욱</div><div class="member-name">권재욱</div><div class="member-role">대장</div></div>
      <div class="member-card"><div class="avatar" style="background:#e1f5ee;color:#085041">내원</div><div class="member-name">이내원</div><div class="member-role">멤버</div></div>
      <div class="member-card"><div class="avatar" style="background:#faeeda;color:#633806">우경</div><div class="member-name">김우경</div><div class="member-role">멤버</div></div>
      <div class="member-card"><div class="avatar" style="background:#fbeaf0;color:#72243e">세인</div><div class="member-name">정세인</div><div class="member-role">멤버</div></div>
    </div>
  </div>
</div>

<div id="page-schedule" class="page">
  <div class="admin-bar">
    <label>🔒 관리자</label>
    <input type="password" id="admin-pw" placeholder="비밀번호"/>
    <button onclick="checkAdmin()">확인</button>
    <span id="admin-status" style="font-size:12px"></span>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="section-label">🗻 후지산 플랜 타임테이블</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">플랜 선택시 16~17일 일정이 자동 세팅돼요 (관리자 전용)</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="plan-btn" onclick="loadTimetable('free')"><div style="font-weight:500">🅐 자유여행</div><div style="font-size:10px;color:var(--muted)">스바시리 2,450m</div></button>
      <button class="plan-btn" onclick="loadTimetable('willer')"><div style="font-weight:500">🅑 WILLER 투어</div><div style="font-size:10px;color:var(--muted)">요시다 3,400m</div></button>
      <button class="plan-btn" onclick="loadTimetable('fmg')"><div style="font-weight:500">🅒 FMG 투어</div><div style="font-size:10px;color:var(--muted)">요시다 3,400m</div></button>
    </div>
    <div id="timetable-status" style="font-size:12px;color:var(--green);margin-top:8px"></div>
  </div>
  <div class="suggest-form">
    <div class="form-title">+ 일정 제안하기</div>
    <div class="form-grid-2">
      <select id="sug-day">
        <option value="7/15">7월 15일 (화)</option><option value="7/16">7월 16일 (수)</option>
        <option value="7/17">7월 17일 (목)</option><option value="7/18">7월 18일 (금)</option>
        <option value="7/19">7월 19일 (토)</option><option value="7/20">7월 20일 (일)</option>
        <option value="7/21">7월 21일 (월)</option>
      </select>
      <input type="text" id="sug-time" placeholder="시간 (예: 14:00)"/>
    </div>
    <input type="text" id="sug-title" placeholder="장소 / 활동명" style="margin-bottom:8px"/>
    <textarea id="sug-desc" placeholder="간단한 설명 (선택)" style="margin-bottom:8px"></textarea>
    <div class="form-grid-2">
      <select id="sug-name">
        <option value="">제안자 선택</option>
        <option>박준경</option><option>권재욱</option><option>이내원</option><option>김우경</option><option>정세인</option>
      </select>
      <button class="primary" onclick="addSuggestion()">제안 등록</button>
    </div>
  </div>
  <div id="schedule-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
</div>

<div id="page-expense" class="page">
  <div class="metric-grid" id="expense-summary"></div>
  <div class="card" style="margin-bottom:14px">
    <div class="section-label">지출 추가</div>
    <div class="input-row">
      <input type="text" id="exp-title" placeholder="항목명"/>
      <input type="number" id="exp-amount" placeholder="금액 (원)" style="max-width:120px"/>
    </div>
    <div class="input-row">
      <select id="exp-payer">
        <option value="">낸 사람</option>
        <option>박준경</option><option>권재욱</option><option>이내원</option><option>김우경</option><option>정세인</option>
      </select>
      <select id="exp-cat">
        <option>식사</option><option>교통</option><option>숙소</option><option>관광</option><option>쇼핑</option><option>기타</option>
      </select>
      <button class="primary" onclick="addExpense()" style="white-space:nowrap">추가</button>
    </div>
  </div>
  <div id="expense-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
  <div id="settle-section"></div>
</div>

<div id="page-checklist" class="page">
  <div class="card" style="margin-bottom:10px">
    <div id="checklist-progress-label" style="font-size:13px;margin-bottom:6px">준비물 로딩 중...</div>
    <div class="progress-wrap"><div class="progress-bar" id="checklist-progress-bar" style="width:0%"></div></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="input-row">
      <input type="text" id="check-input" placeholder="준비물 추가..."/>
      <select id="check-cat" style="max-width:100px">
        <option>서류</option><option>의류</option><option>전자기기</option><option>세면도구</option><option>기타</option>
      </select>
      <button class="primary" onclick="addCheckItem()" style="white-space:nowrap">추가</button>
    </div>
  </div>
  <div id="checklist-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
</div>

<div id="page-places" class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="section-label">장소 추가</div>
    <div class="input-row">
      <select id="place-type" style="max-width:80px"><option>숙소</option><option>맛집</option><option>관광</option><option>카페</option></select>
      <input type="text" id="place-name" placeholder="장소명"/>
      <input type="text" id="place-area" placeholder="지역" style="max-width:80px"/>
    </div>
    <div class="input-row">
      <input type="text" id="place-note" placeholder="메모 (선택)"/>
      <button class="primary" onclick="addPlace()" style="white-space:nowrap">추가</button>
    </div>
  </div>
  <div id="places-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
</div>

</main>
<div class="toast" id="toast"></div>

<script>
window.showPage = function(id) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('#main-nav button').forEach(function(b){b.classList.remove('active');});
  document.getElementById('page-'+id).classList.add('active');
  var pages = ['home','schedule','expense','checklist','places'];
  document.querySelectorAll('#main-nav button')[pages.indexOf(id)].classList.add('active');
};
</script>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getDatabase,ref,onValue,set,push,remove,update}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

var cfg={apiKey:'AIzaSyBwDn827_L82baptEmB6E91pMfbTD0gG9E',authDomain:'junkyeong-tour.firebaseapp.com',databaseURL:'https://junkyeong-tour-default-rtdb.firebaseio.com',projectId:'junkyeong-tour',storageBucket:'junkyeong-tour.firebasestorage.app',messagingSenderId:'145452062852',appId:'1:145452062852:web:5abc73825c4e42e204cad1'};
var app=initializeApp(cfg), db=getDatabase(app);
var ADMIN_PW='1221', isAdmin=false;
var MEMBERS=['박준경','권재욱','이내원','김우경','정세인'];
var DAYS=['7/15','7/16','7/17','7/18','7/19','7/20','7/21'];
var DAY_LABELS={'7/15':'7월 15일 (화)','7/16':'7월 16일 (수)','7/17':'7월 17일 (목)','7/18':'7월 18일 (금)','7/19':'7월 19일 (토)','7/20':'7월 20일 (일)','7/21':'7월 21일 (월)'};
var catBadge={식사:'badge-amber',교통:'badge-blue',숙소:'badge-blue',관광:'badge-green',쇼핑:'badge-gray',기타:'badge-gray'};
var typeIcon={숙소:'🏨',맛집:'🍜',관광:'📸',카페:'☕'};
var typeBadge={숙소:'badge-blue',맛집:'badge-amber',관광:'badge-green',카페:'badge-gray'};

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function setSynced(){document.getElementById('sync-dot').className='sync-dot live';document.getElementById('sync-label').textContent='실시간 연결됨';}
function setError(){document.getElementById('sync-dot').className='sync-dot error';document.getElementById('sync-label').textContent='연결 오류';}
function timeToMin(t){if(!t)return 9999;var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]||0);}

// D-DAY
(function(){
  var now=new Date(), dep=new Date('2026-07-15');
  var diff=Math.ceil((dep-now)/(1000*60*60*24));
  var d=document.getElementById('dday-num'), l=document.getElementById('dday-label');
  if(diff>0){d.textContent='D-'+diff;l.textContent='출발까지';}
  else if(diff===0){d.textContent='D-Day';l.textContent='오늘 출발!';}
  else{d.textContent='D+'+Math.abs(diff);l.textContent='여행 완료';}
})();

// ADMIN
window.checkAdmin=function(){

function renderSchedule(){
  var list=document.getElementById('schedule-list');
  var html='';
  DAYS.forEach(function(day){
    var items=Object.entries(suggestionsData).filter(function(e){return e[1].day===day;}).sort(function(a,b){return timeToMin(a[1].time)-timeToMin(b[1].time);});
    if(!items.length)return;
    html+='<div class="day-block"><div class="day-title">'+DAY_LABELS[day]+'</div><div class="tl-wrap">';
    items.forEach(function(entry){
      var key=entry[0], s=entry[1];
      html+='<div class="tl-item">';
      html+='<div class="tl-dot '+(s.adopted?'adopted':'pending')+'"></div>';
      html+='<div class="tl-time">'+(s.time||'')+'</div>';
      html+='<div class="tl-title">'+s.title+'</div>';
      if(s.desc)html+='<div class="tl-desc">'+s.desc+'</div>';
      html+='<div class="tl-meta">';
      html+='<span class="badge '+(s.adopted?'badge-green':'badge-amber')+'">'+(s.adopted?'채택됨':'검토 중')+'</span>';
      html+='<span style="font-size:11px;color:var(--hint)">by '+s.name+'</span>';
      if(isAdmin){
        html+='<button onclick="toggleAdopt(''+key+'','+s.adopted+')" style="font-size:11px;padding:2px 8px">'+(s.adopted?'채택 취소':'채택')+'</button>';
        html+='<button class="danger-btn" onclick="deleteSug(''+key+'')">🗑</button>';
      }
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  var pending=Object.entries(suggestionsData).filter(function(e){return !e[1].adopted;});
  if(isAdmin&&pending.length){
    html+='<div style="margin-top:8px"><div class="section-label">검토 대기 ('+pending.length+'건)</div>';
    pending.forEach(function(entry){
      var key=entry[0], s=entry[1];
      html+='<div class="pending-card">';
      html+='<div><div style="font-size:13px;font-weight:500">'+DAY_LABELS[s.day]+' '+(s.time||'')+' · '+s.title+'</div>';
      if(s.desc)html+='<div style="font-size:12px;color:var(--amber);margin-top:2px">'+s.desc+'</div>';
      html+='<div style="font-size:11px;color:var(--muted);margin-top:4px">by '+s.name+'</div></div>';
      html+='<div style="display:flex;gap:6px">';
      html+='<button class="primary" onclick="toggleAdopt(''+key+'',false)" style="font-size:12px;padding:4px 10px">채택</button>';
      html+='<button class="danger-btn" onclick="deleteSug(''+key+'')">🗑</button>';
      html+='</div></div>';
    });
    html+='</div>';
  }
  if(!html)html='<div style="padding:24px 0;text-align:center;color:var(--muted);font-size:13px">아직 일정이 없어요. 위에서 제안해 보세요!</div>';
  list.innerHTML=html;
}

var expensesData={}, transfersData={};

onValue(ref(db,'transfers'),function(snap){transfersData=snap.val()||{};renderExpense();});

function renderExpense(){
  var items=Object.entries(expensesData);
  var total=items.reduce(function(a,e){return a+(e[1].amount||0);},0);
  var per=Math.round(total/5);
  var paid={};
  MEMBERS.forEach(function(m){paid[m]=0;});
  items.forEach(function(e){if(paid[e[1].payer]!==undefined)paid[e[1].payer]+=e[1].amount;});

  document.getElementById('expense-summary').innerHTML=
    '<div class="metric"><div class="metric-label">총 지출</div><div class="metric-value">'+total.toLocaleString()+'원</div></div>'+
    '<div class="metric"><div class="metric-label">1인 부담</div><div class="metric-value">'+per.toLocaleString()+'원</div></div>'+
    '<div class="metric"><div class="metric-label">항목 수</div><div class="metric-value">'+items.length+'건</div></div>';

  var listHtml='';
  if(!items.length){
    listHtml='<div class="card" style="color:var(--muted);text-align:center;padding:16px">지출 내역이 없어요.</div>';
  } else {
    listHtml='<div class="card" style="padding:6px 16px">';
    items.forEach(function(entry){
      var key=entry[0], e=entry[1];
      listHtml+='<div class="expense-item">';
      listHtml+='<div><span style="font-size:14px;font-weight:500">'+e.title+'</span>';
      listHtml+='<span class="badge '+(catBadge[e.cat]||'badge-gray')+'" style="margin-left:8px">'+e.cat+'</span></div>';
      listHtml+='<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">';
      listHtml+='<div style="text-align:right"><div style="font-size:14px;font-weight:500">'+(e.amount||0).toLocaleString()+'원</div>';
      listHtml+='<div style="font-size:11px;color:var(--hint)">'+e.payer+'</div></div>';
      listHtml+='<button class="danger-btn" onclick="deleteExpense(''+key+'')">🗑</button>';
      listHtml+='</div></div>';
    });
    listHtml+='</div>';
  }
  document.getElementById('expense-list').innerHTML=listHtml;

  // 정산 알고리즘
  var bal={};
  MEMBERS.forEach(function(m){bal[m]=(paid[m]||0)-per;});
  var cred=MEMBERS.filter(function(m){return bal[m]>0;}).map(function(m){return {name:m,amt:bal[m]};});
  var deb=MEMBERS.filter(function(m){return bal[m]<0;}).map(function(m){return {name:m,amt:-bal[m]};});
  var debts=[], ci=0, di=0;
  var cc=cred.map(function(c){return {name:c.name,amt:c.amt};});
  var dc=deb.map(function(d){return {name:d.name,amt:d.amt};});
  while(ci<cc.length&&di<dc.length){
    var s=Math.min(cc[ci].amt,dc[di].amt);
    if(s>0)debts.push({from:dc[di].name,to:cc[ci].name,amount:Math.round(s)});
    cc[ci].amt-=s; dc[di].amt-=s;
    if(cc[ci].amt<1)ci++; if(dc[di].amt<1)di++;
  }

  var settle='<div class="section-label" style="margin-top:18px">💰 개인별 정산 현황</div>';
  settle+='<div class="card" style="padding:6px 16px;margin-bottom:12px">';
  MEMBERS.forEach(function(m){
    var diff=(paid[m]||0)-per;
    var color=diff>=0?'var(--green)':'var(--accent)';
    var status=diff>=0?'받을 돈':'내야 할 돈';
    settle+='<div class="settle-row"><span style="font-weight:500">'+m+'</span>';
    settle+='<div><span style="font-size:11px;color:var(--muted);margin-right:10px">낸 돈 '+(paid[m]||0).toLocaleString()+'원</span>';
    settle+='<span style="font-size:12px;color:'+color+';font-weight:500">'+status+' '+Math.abs(diff).toLocaleString()+'원</span></div></div>';
  });
  settle+='</div>';
  settle+='<div class="section-label">📲 송금 목록</div>';
  if(!debts.length){
    settle+='<div class="card" style="text-align:center;color:var(--green);padding:16px;font-size:13px">🎉 모든 정산이 완료되었어요!</div>';
  } else {
    settle+='<div class="card" style="padding:6px 16px">';
    debts.forEach(function(d){
      var key='transfer_'+d.from+'_'+d.to;
      var done=transfersData[key];
      settle+='<div class="settle-row" style="opacity:'+(done?'.5':'1')+'">';
      settle+='<div style="display:flex;align-items:center;gap:8px;flex:1">';
      settle+='<span style="font-size:16px">'+(done?'✅':'💸')+'</span>';
      settle+='<div><div style="font-size:13px;font-weight:500">';
      settle+='<span style="color:var(--accent)">'+d.from+'</span>';
      settle+='<span style="color:var(--muted);margin:0 6px">→</span>';
      settle+='<span style="color:var(--green)">'+d.to+'</span></div>';
      settle+='<div style="font-size:12px;color:var(--muted);margin-top:1px">'+d.amount.toLocaleString()+'원</div></div></div>';
      var btnStyle=done?'background:var(--green-light);color:var(--green);border-color:var(--green)':'';
      settle+='<button onclick="toggleTransfer(''+key+'')" style="font-size:11px;padding:4px 10px;'+btnStyle+'">'+(done?'완료 취소':'송금 완료')+'</button>';
      settle+='</div>';
    });
    settle+='</div>';
  }
  document.getElementById('settle-section').innerHTML=settle;
}

function renderChecklist(data){
  var items=Object.entries(data);
  var done=items.filter(function(e){return e[1].done;}).length;
  var pct=items.length?Math.round(done/items.length*100):0;
  document.getElementById('checklist-progress-label').textContent='준비 완료 '+done+'/'+items.length+' ('+pct+'%)';
  document.getElementById('checklist-progress-bar').style.width=pct+'%';
  var cats=[];
  items.forEach(function(e){if(cats.indexOf(e[1].cat)<0)cats.push(e[1].cat);});
  if(!items.length){document.getElementById('checklist-list').innerHTML='<div class="card" style="color:var(--muted);text-align:center;padding:16px">준비물이 없어요.</div>';return;}
  var html='';
  cats.forEach(function(cat){
    var ci=items.filter(function(e){return e[1].cat===cat;});
    var doneCnt=ci.filter(function(e){return e[1].done;}).length;
    html+='<div style="margin-bottom:12px"><div class="section-label">'+cat+' ('+doneCnt+'/'+ci.length+')</div>';
    html+='<div class="card" style="padding:4px 14px">';
    ci.forEach(function(entry){
      var key=entry[0], c=entry[1];
      html+='<div class="check-item'+(c.done?' done':'')+'" onclick="toggleCheck(''+key+'','+c.done+')">';
      html+='<input type="checkbox"'+(c.done?' checked':'')+' onclick="event.stopPropagation();toggleCheck(''+key+'','+c.done+')" style="width:15px;height:15px"/>';
      html+='<span class="check-text" style="flex:1">'+c.text+'</span>';
      html+='<button onclick="event.stopPropagation();deleteCheck(''+key+'')" class="danger-btn">🗑</button>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('checklist-list').innerHTML=html;
}

  if(!items.length){document.getElementById('places-list').innerHTML='<div class="card" style="color:var(--muted);text-align:center;padding:16px">장소가 없어요.</div>';return;}
  var html='';
  types.forEach(function(type){
    var ti=items.filter(function(e){return e[1].type===type;});
    if(!ti.length)return;
    html+='<div style="margin-bottom:16px"><div class="section-label">'+typeIcon[type]+' '+type+'</div>';
    html+='<div class="card" style="padding:6px 14px">';
    ti.forEach(function(entry){
      var key=entry[0], p=entry[1];
      var q=encodeURIComponent((p.name||'')+' '+(p.area||'')+' 도쿄');
      html+='<div class="place-item">';
      html+='<div><div class="place-name">'+p.name+' <span class="badge '+(typeBadge[p.type]||'badge-gray')+'">'+(p.area||'')+'</span></div>';
      if(p.note)html+='<div class="place-note">'+p.note+'</div>';
      html+='</div>';
      html+='<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">';
      html+='<a href="https://www.google.com/maps/search/'+q+'" target="_blank" class="map-link">🗺 지도</a>';
      html+='<button class="danger-btn" onclick="deletePlace(''+key+'')">🗑</button>';
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  document.getElementById('places-list').innerHTML=html;
}
window.addPlace=function(){
  var type=document.getElementById('place-type').value;
  var name=document.getElementById('place-name').value.trim();
  var area=document.getElementById('place-area').value.trim();
  var note=document.getElementById('place-note').value.trim();
  if(!name)return;
  push(ref(db,'places'),{type:type,name:name,area:area,note:note});
  document.getElementById('place-name').value='';
  document.getElementById('place-area').value='';
  document.getElementById('place-note').value='';
  toast('장소가 추가되었어요!');
};
window.deletePlace=function(key){remove(ref(db,'places/'+key));toast('삭제되었어요.');};
</script>
</body>
</html>
