<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준경준경 투어 🗼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --border: #e8e4dc;
    --text: #1a1814;
    --muted: #8a8680;
    --hint: #bbb8b2;
    --accent: #c8472a;
    --accent-light: #fdf0ed;
    --green: #2a7a4f;
    --green-light: #edf7f2;
    --amber: #b87d1a;
    --amber-light: #fdf6e8;
    --blue: #2054a8;
    --blue-light: #eef3fc;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* HEADER */
  header {
    background: var(--text);
    color: #fff;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: #fff;
  }
  .logo span { color: var(--accent); }
  .header-meta {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #888;
    display: inline-block;
    margin-right: 5px;
    transition: background 0.3s;
  }
  .sync-dot.live { background: #4caf7d; animation: pulse 2s infinite; }
  .sync-dot.error { background: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

  /* NAV */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 24px;
    gap: 0;
    overflow-x: auto;
  }
  nav button {
    padding: 14px 18px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
  nav button:hover:not(.active) { color: var(--text); }

  /* LAYOUT */
  main { max-width: 780px; margin: 0 auto; padding: 28px 20px 60px; }
  .page { display: none; }
  .page.active { display: block; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .card-sm { padding: 14px 18px; }

  /* BADGES */
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .badge-red { background: var(--accent-light); color: var(--accent); }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }
  .badge-blue { background: var(--blue-light); color: var(--blue); }
  .badge-gray { background: #f1efe8; color: #5c5a56; }

  /* BUTTONS */
  button {
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    padding: 7px 14px;
    transition: all .15s;
  }
  button:hover { background: var(--bg); border-color: var(--hint); }
  button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  button.primary:hover { background: #333; }
  button.danger-btn { color: var(--accent); border-color: transparent; background: none; padding: 4px 6px; }
  button.danger-btn:hover { background: var(--accent-light); }

  /* INPUTS */
  input, select, textarea {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    background: var(--surface);
    color: var(--text);
    width: 100%;
    transition: border-color .2s;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--text); }
  textarea { resize: vertical; min-height: 60px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .input-row input, .input-row select { flex: 1; }

  /* SECTION TITLE */
  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* HERO */
  .hero {
    background: var(--text);
    color: #fff;
    border-radius: var(--radius);
    padding: 36px 28px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-left h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .hero-left h1 span { color: var(--accent); }
  .hero-left p { color: rgba(255,255,255,0.5); font-size: 13px; }
  .dday-box { text-align: center; flex-shrink: 0; }
  .dday-num {
    font-family: 'DM Serif Display', serif;
    font-size: 52px;
    color: var(--accent);
    line-height: 1;
  }
  .dday-label { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }

  /* METRIC GRID */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .metric-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; }

  /* MEMBER GRID */
  .member-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .member-card { text-align: center; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
    margin: 0 auto 7px;
  }
  .member-name { font-size: 12px; color: var(--text); }
  .member-role { font-size: 10px; color: var(--muted); margin-top: 1px; }

  /* TIMELINE */
  .day-block { margin-bottom: 28px; }
  .day-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tl-wrap { position: relative; padding-left: 28px; }
  .tl-wrap::before {
    content: '';
    position: absolute;
    left: 9px; top: 8px; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .tl-item { position: relative; margin-bottom: 18px; }
  .tl-dot {
    position: absolute;
    left: -20px; top: 5px;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
  }
  .tl-dot.adopted { border-color: var(--green); background: var(--green-light); }
  .tl-dot.pending { border-color: var(--amber); background: var(--amber-light); }
  .tl-time { font-size: 11px; color: var(--hint); margin-bottom: 3px; }
  .tl-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .tl-desc { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .tl-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ADMIN BAR */
  .admin-bar {
    background: #f7f6f2;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .admin-bar label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .admin-bar input { width: 110px; flex: none; }
  #admin-status { font-size: 12px; }

  /* SUGGEST FORM */
  .suggest-form {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 22px;
  }
  .suggest-form .form-title { font-size: 13px; font-weight: 500; margin-bottom: 14px; color: var(--muted); }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

  /* EXPENSE */
  .expense-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .expense-item:last-child { border: none; }
  .settle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .settle-row:last-child { border: none; }

  /* CHECKLIST */
  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .check-item:last-child { border: none; }
  .check-item input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
  .check-item.done .check-text { text-decoration: line-through; color: var(--hint); }

  /* PLACES */
  .place-item {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .place-item:last-child { border: none; }
  .place-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .place-note { font-size: 12px; color: var(--muted); }
  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid #b5d4f4;
    color: var(--blue);
    border-radius: var(--radius-sm);
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background .15s;
  }
  .map-link:hover { background: var(--blue-light); }

  /* LOADING */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--muted);
    gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    z-index: 9999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* PENDING SECTION */
  .pending-card {
    border-left: 3px solid var(--amber);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 12px 14px;
    background: var(--amber-light);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
  }

  @media (max-width: 600px) {
    .hero { padding: 24px 20px; }
    .hero-left h1 { font-size: 28px; }
    .dday-num { font-size: 40px; }
    .member-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .avatar { width: 40px; height: 40px; font-size: 11px; }
    .member-name { font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">JUNKYEONG<span>TOUR</span></div>
  <div class="header-meta">
    <span><span class="sync-dot" id="sync-dot"></span><span id="sync-label">연결 중...</span></span>
    <span>도쿄 7/15–21</span>
  </div>
</header>

<nav>
  <button class="active" onclick="showPage('home')">🏠 홈</button>
  <button onclick="showPage('schedule')">📅 일정</button>
  <button onclick="showPage('expense')">💴 경비</button>
  <button onclick="showPage('checklist')">✅ 준비물</button>
  <button onclick="showPage('places')">📍 숙소·맛집</button>
</nav>

<main>

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="hero">
    <div class="hero-left">
      <h1>준경준경<br><span>투어</span></h1>
      <p>5인 5색 도쿄 어드벤처 · 7월 15일 – 21일</p>
    </div>
    <div class="dday-box">
      <div class="dday-num" id="dday-num">–</div>
      <div class="dday-label" id="dday-label">출발까지</div>
    </div>
  </div>

  <div class="metric-grid">
    <div class="metric"><div class="metric-label">여행 기간</div><div class="metric-value">7일</div></div>
    <div class="metric"><div class="metric-label">멤버</div><div class="metric-value">5명</div></div>
    <div class="metric"><div class="metric-label">목적지</div><div class="metric-value">도쿄</div></div>
    <div class="metric"><div class="metric-label">채택 일정</div><div class="metric-value" id="adopted-count">–</div></div>
  </div>

  <div class="card">
    <div class="section-label">멤버</div>
    <div class="member-grid">
      <div class="member-card">
        <div class="avatar" style="background:#eeedfe;color:#3c3489">준경</div>
        <div class="member-name">박준경</div>
        <div class="member-role">관리자</div>
      </div>
      <div class="member-card">
        <div class="avatar" style="background:#e6f1fb;color:#0c447c">재욱</div>
        <div class="member-name">권재욱</div>
        <div class="member-role">멤버</div>
      </div>
      <div class="member-card">
        <div class="avatar" style="background:#e1f5ee;color:#085041">내원</div>
        <div class="member-name">이내원</div>
        <div class="member-role">멤버</div>
      </div>
      <div class="member-card">
        <div class="avatar" style="background:#faeeda;color:#633806">우경</div>
        <div class="member-name">김우경</div>
        <div class="member-role">멤버</div>
      </div>
      <div class="member-card">
        <div class="avatar" style="background:#fbeaf0;color:#72243e">세인</div>
        <div class="member-name">정세인</div>
        <div class="member-role">멤버</div>
      </div>
    </div>
  </div>
</div>

<!-- SCHEDULE -->
<div id="page-schedule" class="page">
  <div class="admin-bar">
    <label>🔒 관리자</label>
    <input type="password" id="admin-pw" placeholder="비밀번호" />
    <button onclick="checkAdmin()">확인</button>
    <span id="admin-status"></span>
  </div>

  <div class="suggest-form">
    <div class="form-title">+ 일정 제안하기</div>
    <div class="form-grid-2">
      <select id="sug-day">
        <option value="7/15">7월 15일 (화)</option>
        <option value="7/16">7월 16일 (수)</option>
        <option value="7/17">7월 17일 (목)</option>
        <option value="7/18">7월 18일 (금)</option>
        <option value="7/19">7월 19일 (토)</option>
        <option value="7/20">7월 20일 (일)</option>
        <option value="7/21">7월 21일 (월)</option>
      </select>
      <input type="text" id="sug-time" placeholder="시간 (예: 14:00)" />
    </div>
    <input type="text" id="sug-title" placeholder="장소 / 활동명" style="margin-bottom:8px" />
    <textarea id="sug-desc" placeholder="간단한 설명 (선택)" style="margin-bottom:8px"></textarea>
    <div class="form-grid-2">
      <select id="sug-name">
        <option value="">제안자 선택</option>
        <option>박준경</option><option>권재욱</option><option>이내원</option><option>김우경</option><option>정세인</option>
      </select>
      <button class="primary" onclick="addSuggestion()">제안 등록</button>
    </div>
  </div>

  <div id="schedule-list"><div class="loading"><div class="spinner"></div><span>일정 불러오는 중...</span></div></div>
</div>

<!-- EXPENSE -->
<div id="page-expense" class="page">
  <div class="metric-grid" id="expense-summary"></div>

  <div class="card" style="margin-bottom:18px">
    <div class="section-label">지출 추가</div>
    <div class="input-row">
      <input type="text" id="exp-title" placeholder="항목명 (예: 라멘집)" />
      <input type="number" id="exp-amount" placeholder="금액 (원)" style="max-width:130px" />
    </div>
    <div class="input-row">
      <select id="exp-payer">
        <option value="">낸 사람</option>
        <option>박준경</option><option>권재욱</option><option>이내원</option><option>김우경</option><option>정세인</option>
      </select>
      <select id="exp-cat">
        <option>식사</option><option>교통</option><option>숙소</option><option>관광</option><option>쇼핑</option><option>기타</option>
      </select>
      <button class="primary" onclick="addExpense()" style="white-space:nowrap">추가</button>
    </div>
  </div>

  <div id="expense-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
  <div id="settle-section"></div>
</div>

<!-- CHECKLIST -->
<div id="page-checklist" class="page">
  <div class="card" style="margin-bottom:14px">
    <div class="input-row">
      <input type="text" id="check-input" placeholder="준비물 추가..." />
      <select id="check-cat" style="max-width:110px">
        <option>서류</option><option>의류</option><option>전자기기</option><option>세면도구</option><option>기타</option>
      </select>
      <button class="primary" onclick="addCheckItem()" style="white-space:nowrap">추가</button>
    </div>
  </div>
  <div id="checklist-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
</div>

<!-- PLACES -->
<div id="page-places" class="page">
  <div class="card" style="margin-bottom:18px">
    <div class="section-label">장소 추가</div>
    <div class="input-row">
      <select id="place-type" style="max-width:90px">
        <option>숙소</option><option>맛집</option><option>관광</option><option>카페</option>
      </select>
      <input type="text" id="place-name" placeholder="장소명" />
      <input type="text" id="place-area" placeholder="지역" style="max-width:90px" />
    </div>
    <div class="input-row">
      <input type="text" id="place-note" placeholder="메모 (선택)" />
      <button class="primary" onclick="addPlace()" style="white-space:nowrap">추가</button>
    </div>
  </div>
  <div id="places-list"><div class="loading"><div class="spinner"></div><span>불러오는 중...</span></div></div>
</div>

</main>

<div class="toast" id="toast"></div>

  const DAY_LABELS = {
    '7/15':'7월 15일 (화)','7/16':'7월 16일 (수)','7/17':'7월 17일 (목)',
    '7/18':'7월 18일 (금)','7/19':'7월 19일 (토)','7/20':'7월 20일 (일)','7/21':'7월 21일 (월)'
  };
  const MEMBERS = ['박준경','권재욱','이내원','김우경','정세인'];
  const catBadge = {식사:'badge-amber',교통:'badge-blue',숙소:'badge-blue',관광:'badge-green',쇼핑:'badge-gray',기타:'badge-gray'};
  const typeIcon = {숙소:'🏨',맛집:'🍜',관광:'📸',카페:'☕'};
  const typeBadge = {숙소:'badge-blue',맛집:'badge-amber',관광:'badge-green',카페:'badge-gray'};

  // Sync indicator
  const syncDot = document.getElementById('sync-dot');
  const syncLabel = document.getElementById('sync-label');

  function setSynced() { syncDot.className='sync-dot live'; syncLabel.textContent='실시간 연결됨'; }
  function setError() { syncDot.className='sync-dot error'; syncLabel.textContent='연결 오류'; }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // D-Day
  function updateDday() {
    const now = new Date();
    const dep = new Date('2025-07-15');
    const diff = Math.ceil((dep - now) / (1000*60*60*24));
    const d = document.getElementById('dday-num');
    const l = document.getElementById('dday-label');
    if (diff > 0) { d.textContent = 'D-' + diff; l.textContent = '출발까지'; }
    else if (diff === 0) { d.textContent = 'D-Day'; l.textContent = '오늘 출발!'; }
    else { d.textContent = 'D+' + Math.abs(diff); l.textContent = '여행 완료'; }
  }
  updateDday();

  // Page switching
  window.showPage = function(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    const idx = ['home','schedule','expense','checklist','places'].indexOf(id);
    document.querySelectorAll('nav button')[idx].classList.add('active');
  };

  // Admin
  window.checkAdmin = function() {
    const pw = document.getElementById('admin-pw').value;
    const st = document.getElementById('admin-status');
    if (pw === ADMIN_PW) {
      isAdmin = true;
      st.textContent = '✓ 관리자 모드 활성화';
      st.style.color = '#2a7a4f';
      renderSchedule();
    } else {
      isAdmin = false;
      st.textContent = '✗ 비밀번호 오류';
      st.style.color = '#c8472a';
    }
  };

  // ─── SUGGESTIONS ───
  let suggestionsData = {};

  onValue(ref(db, 'suggestions'), (snap) => {
    suggestionsData = snap.val() || {};
    setSynced();
    renderSchedule();
    const adopted = Object.values(suggestionsData).filter(s => s.adopted).length;
    document.getElementById('adopted-count').textContent = adopted;
  }, setError);

  function renderSchedule() {
    const list = document.getElementById('schedule-list');
    let html = '';
    DAYS.forEach(day => {
      const items = Object.entries(suggestionsData)
        .filter(([,s]) => s.day === day)
        .sort((a,b) => (a[1].time||'').localeCompare(b[1].time||''));
      if (!items.length) return;
      html += `<div class="day-block">
        <div class="day-title">${DAY_LABELS[day]}</div>
        <div class="tl-wrap">`;
      items.forEach(([key, s]) => {
        html += `<div class="tl-item">
          <div class="tl-dot ${s.adopted?'adopted':'pending'}"></div>
          <div class="tl-time">${s.time||''}</div>
          <div class="tl-title">${s.title}</div>
          ${s.desc ? `<div class="tl-desc">${s.desc}</div>` : ''}
          <div class="tl-meta">
            <span class="badge ${s.adopted?'badge-green':'badge-amber'}">${s.adopted?'채택됨':'검토 중'}</span>
            <span style="font-size:11px;color:var(--hint)">by ${s.name}</span>
            ${isAdmin ? `
              <button onclick="toggleAdopt('${key}', ${s.adopted})" style="font-size:11px;padding:2px 8px">${s.adopted?'채택 취소':'채택'}</button>
              <button class="danger-btn" onclick="deleteSug('${key}')">🗑</button>` : ''}
          </div>
        </div>`;
      });
      html += `</div></div>`;
    });

    const pending = Object.entries(suggestionsData).filter(([,s]) => !s.adopted);
    if (isAdmin && pending.length) {
      html += `<div style="margin-top:8px"><div class="section-label">검토 대기 (${pending.length}건)</div>`;
      pending.forEach(([key, s]) => {
        html += `<div class="pending-card">
          <div>
            <div style="font-size:13px;font-weight:500">${DAY_LABELS[s.day]} ${s.time||''} · ${s.title}</div>
            ${s.desc ? `<div style="font-size:12px;color:var(--amber);margin-top:2px">${s.desc}</div>` : ''}
            <div style="font-size:11px;color:var(--muted);margin-top:4px">by ${s.name}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button class="primary" onclick="toggleAdopt('${key}', false)" style="font-size:12px;padding:5px 12px">채택</button>
            <button class="danger-btn" onclick="deleteSug('${key}')">🗑</button>
          </div>
        </div>`;
      });
      html += '</div>';
    }

    list.innerHTML = html || '<div style="padding:24px 0;text-align:center;color:var(--muted);font-size:13px">아직 일정이 없어요. 위에서 제안해 보세요!</div>';
  }

  window.addSuggestion = function() {
    const day = document.getElementById('sug-day').value;
    const time = document.getElementById('sug-time').value.trim();
    const title = document.getElementById('sug-title').value.trim();
    const desc = document.getElementById('sug-desc').value.trim();
    const name = document.getElementById('sug-name').value;
    if (!title || !name) return alert('장소명과 제안자를 입력해 주세요.');
    push(ref(db, 'suggestions'), { day, time, title, desc, name, adopted: false });
    document.getElementById('sug-title').value = '';
    document.getElementById('sug-desc').value = '';
    document.getElementById('sug-time').value = '';
    document.getElementById('sug-name').value = '';
    toast('일정이 제안되었어요!');
  };

  window.toggleAdopt = function(key, current) {
    update(ref(db, 'suggestions/' + key), { adopted: !current });
    toast(!current ? '일정이 채택되었어요!' : '채택이 취소되었어요.');
  };

  window.deleteSug = function(key) {
    if (!confirm('이 일정을 삭제할까요?')) return;
    remove(ref(db, 'suggestions/' + key));
    toast('삭제되었어요.');
  };

  // ─── EXPENSES ───
  let expensesData = {};

  onValue(ref(db, 'expenses'), (snap) => {
    expensesData = snap.val() || {};
    renderExpense();
  });

  function renderExpense() {
    const items = Object.entries(expensesData);
    const total = items.reduce((a,[,e]) => a + (e.amount||0), 0);
    const per = Math.round(total / 5);
    const paid = {};
    MEMBERS.forEach(m => paid[m] = 0);
    items.forEach(([,e]) => { if (paid[e.payer] !== undefined) paid[e.payer] += e.amount; });

    document.getElementById('expense-summary').innerHTML = `
      <div class="metric"><div class="metric-label">총 지출</div><div class="metric-value">${total.toLocaleString()}원</div></div>
      <div class="metric"><div class="metric-label">1인 부담</div><div class="metric-value">${per.toLocaleString()}원</div></div>
      <div class="metric"><div class="metric-label">항목 수</div><div class="metric-value">${items.length}건</div></div>`;

    const listEl = document.getElementById('expense-list');
    if (!items.length) {
      listEl.innerHTML = '<div class="card card-sm" style="color:var(--muted);text-align:center;padding:20px">지출 내역이 없어요.</div>';
    } else {
      listEl.innerHTML = '<div class="card" style="padding:8px 18px">' +
        items.map(([key, e]) => `
          <div class="expense-item">
            <div>
              <span style="font-size:14px;font-weight:500">${e.title}</span>
              <span class="badge ${catBadge[e.cat]||'badge-gray'}" style="margin-left:8px">${e.cat}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
              <div style="text-align:right">
                <div style="font-size:14px;font-weight:500">${(e.amount||0).toLocaleString()}원</div>
                <div style="font-size:11px;color:var(--hint)">${e.payer}</div>
              </div>
              <button class="danger-btn" onclick="deleteExpense('${key}')">🗑</button>
            </div>
          </div>`).join('') + '</div>';
    }

    let settle = '<div class="section-label" style="margin-top:20px">정산 결과</div><div class="card" style="padding:8px 18px">';
    MEMBERS.forEach(m => {
      const diff = (paid[m]||0) - per;
      const sign = diff >= 0 ? '+' : '';
      const color = diff >= 0 ? 'var(--green)' : 'var(--accent)';
      settle += `<div class="settle-row">
        <span style="font-weight:500">${m}</span>
        <div>
          <span style="font-size:12px;color:var(--muted);margin-right:12px">낸 돈 ${(paid[m]||0).toLocaleString()}원</span>
          <span style="font-weight:500;color:${color}">${sign}${diff.toLocaleString()}원</span>
        </div>
      </div>`;
    });
    document.getElementById('settle-section').innerHTML = settle + '</div>';
  }

  window.addExpense = function() {
    const title = document.getElementById('exp-title').value.trim();
    const amount = parseInt(document.getElementById('exp-amount').value);
    const payer = document.getElementById('exp-payer').value;
    const cat = document.getElementById('exp-cat').value;
    if (!title || !amount || !payer) return alert('항목, 금액, 낸 사람을 모두 입력해 주세요.');
    push(ref(db, 'expenses'), { title, amount, payer, cat });
    document.getElementById('exp-title').value = '';
    document.getElementById('exp-amount').value = '';
    toast('지출이 추가되었어요!');
  };

  window.deleteExpense = function(key) {
    remove(ref(db, 'expenses/' + key));
    toast('삭제되었어요.');
  };

  // ─── CHECKLIST ───
  onValue(ref(db, 'checklist'), (snap) => {
    const data = snap.val() || {};
    renderChecklist(data);
  });

  function renderChecklist(data) {
    const items = Object.entries(data);
    const cats = [...new Set(items.map(([,c]) => c.cat))];
    if (!items.length) {
      document.getElementById('checklist-list').innerHTML = '<div class="card card-sm" style="color:var(--muted);text-align:center;padding:20px">준비물이 없어요.</div>';
      return;
    }
    document.getElementById('checklist-list').innerHTML = cats.map(cat => {
      const catItems = items.filter(([,c]) => c.cat === cat);
      const doneCount = catItems.filter(([,c]) => c.done).length;
      return `<div class="card" style="padding:8px 18px;margin-bottom:12px">
        <div class="section-label">${cat} (${doneCount}/${catItems.length})</div>
        ${catItems.map(([key, c]) => `
          <div class="check-item ${c.done?'done':''}" onclick="toggleCheck('${key}', ${c.done})">
            <input type="checkbox" ${c.done?'checked':''} onclick="event.stopPropagation();toggleCheck('${key}', ${c.done})" />
            <span class="check-text" style="flex:1">${c.text}</span>
            <button class="danger-btn" onclick="event.stopPropagation();deleteCheck('${key}')">🗑</button>
          </div>`).join('')}
      </div>`;
    }).join('');
  }

  window.addCheckItem = function() {
    const text = document.getElementById('check-input').value.trim();
    const cat = document.getElementById('check-cat').value;
    if (!text) return;
    push(ref(db, 'checklist'), { text, cat, done: false });
    document.getElementById('check-input').value = '';
    toast('준비물이 추가되었어요!');
  };

  window.toggleCheck = function(key, current) {
    update(ref(db, 'checklist/' + key), { done: !current });
  };

  window.deleteCheck = function(key) {
    remove(ref(db, 'checklist/' + key));
    toast('삭제되었어요.');
  };

  // ─── PLACES ───
  onValue(ref(db, 'places'), (snap) => {
    const data = snap.val() || {};
    renderPlaces(data);
  });

  function renderPlaces(data) {
    const items = Object.entries(data);
    const types = ['숙소','맛집','관광','카페'];
    let html = '';
    types.forEach(type => {
      const typeItems = items.filter(([,p]) => p.type === type);
      if (!typeItems.length) return;
      html += `<div style="margin-bottom:20px">
        <div class="section-label">${typeIcon[type]} ${type}</div>
        <div class="card" style="padding:8px 18px">
          ${typeItems.map(([key, p]) => {
            const q = encodeURIComponent((p.name||'') + ' ' + (p.area||'') + ' 도쿄');
            return `<div class="place-item">
              <div>
                <div class="place-name">${p.name} <span class="badge ${typeBadge[p.type]||'badge-gray'}">${p.area||''}</span></div>
                ${p.note ? `<div class="place-note">${p.note}</div>` : ''}
              </div>
              <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
                <a href="https://www.google.com/maps/search/${q}" target="_blank" class="map-link">🗺 지도 보기</a>
                <button class="danger-btn" onclick="deletePlace('${key}')">🗑</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    document.getElementById('places-list').innerHTML = html || '<div class="card card-sm" style="color:var(--muted);text-align:center;padding:20px">장소가 없어요.</div>';
  }

  window.addPlace = function() {
    const type = document.getElementById('place-type').value;
    const name = document.getElementById('place-name').value.trim();
    const area = document.getElementById('place-area').value.trim();
    const note = document.getElementById('place-note').value.trim();
    if (!name) return;
    push(ref(db, 'places'), { type, name, area, note });
    document.getElementById('place-name').value = '';
    document.getElementById('place-area').value = '';
    document.getElementById('place-note').value = '';
    toast('장소가 추가되었어요!');
  };

  window.deletePlace = function(key) {
    remove(ref(db, 'places/' + key));
    toast('삭제되었어요.');
  };



</script>
</body>
</html>
